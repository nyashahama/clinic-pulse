version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations/"
    queries: "queries/"
    gen:
      go:
        package: "db"
        out: "internal/store/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_pointers_for_null_types: true
        emit_result_struct_pointers: true
        emit_params_struct_pointers: true
        overrides:
          - db_type: "jsonb"
            go_type:
              type: "[]byte"
          - db_type: "inet"
            go_type:
              type: "string"
          - db_type: "inet"
            nullable: true
            go_type:
              type: "string"
              pointer: true
