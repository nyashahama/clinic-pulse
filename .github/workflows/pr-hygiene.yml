name: PR Hygiene

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-hygiene-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whitespace
        run: git diff --check origin/main...HEAD

      - name: Keep local docs out of tracked changes
        shell: bash
        run: |
          allowed_tracked_docs='^docs/(api|architecture|database-schema|demo-video|engineering-decisions|portfolio-case-study|release|screenshots|production-readiness-execution-plan|phase-0-release-gate-stabilization-(spec|implementation-plan|closeout)|phase-1-production-runtime-and-deployment-(spec|implementation-plan))\.md$'
          disallowed_docs="$(git diff --name-only origin/main...HEAD | grep -E '^docs/' | grep -Ev "$allowed_tracked_docs" || true)"

          if [ -n "$disallowed_docs" ]; then
            echo "docs/ is local-only except for the intentionally tracked docs. Do not force-add local docs into public commits."
            echo "$disallowed_docs"
            exit 1
          fi

      - name: Check workflow syntax shape
        run: |
          test -f .github/workflows/ci.yml
          test -f .github/workflows/api-smoke.yml
          test -f .github/workflows/pr-hygiene.yml
          test -f .github/workflows/dependency-review.yml
